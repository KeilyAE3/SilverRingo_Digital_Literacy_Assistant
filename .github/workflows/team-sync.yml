name: Team Sync
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Add the application's dependency installation step here when needed.
      - name: Run all tests
        run: python Tester/automation/check.py
      - name: Save results even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: Tester/.team-sync/
          include-hidden-files: true
          retention-days: 14
